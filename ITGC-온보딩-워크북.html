<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITGC 온보딩 워크북</title>
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface2:#efede7; --border:#dcd9d0; --text:#1d1c19; --muted:#6b6860;
  --accent:#0f5f5c; --accent-soft:#dcebe9; --on-accent:#ffffff;
  --ok:#2e7d4f; --ok-soft:#dff0e5; --warn:#a86a00; --warn-soft:#f8ebcf; --bad:#b3372f; --bad-soft:#f7dedb; --info:#35609c; --info-soft:#dfe8f5; --idle:#77746b; --idle-soft:#e8e6df;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151614; --surface:#1e201d; --surface2:#272a26; --border:#363a34; --text:#eceae3; --muted:#9d9a90;
    --accent:#5cc2bb; --accent-soft:#1d3a38; --on-accent:#0c1f1e;
    --ok:#6cc48e; --ok-soft:#1c3526; --warn:#e2b04c; --warn-soft:#3a2f14; --bad:#ee8077; --bad-soft:#40201d; --info:#86afe6; --info-soft:#1d2b40; --idle:#a3a097; --idle-soft:#2d2f2b;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--border);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{padding:0 10px 16px}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12px}
nav{display:flex;flex-direction:column;gap:2px}
nav .grp{font-size:11px;color:var(--muted);padding:14px 10px 4px;letter-spacing:.04em}
nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:7px;font-size:13.5px}
nav button:hover{background:var(--surface2)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav .cnt{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.save{margin-top:auto;padding:12px 10px 0;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
.save .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
.save .dot.off{background:var(--bad)}
main{padding:28px 32px 60px;min-width:0;max-width:1320px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 20px;max-width:760px}
.banner{background:var(--warn-soft);color:var(--text);border:1px solid var(--warn);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;font-size:13px}
.banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.stat .n{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:12.5px}
.stat .d{font-size:12px;margin-top:2px}
.bar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.btn{border:1px solid var(--border);background:var(--surface);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
input[type=text],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 9px;width:100%}
textarea{min-height:70px;resize:vertical}
.toolbar input[type=search]{width:220px}.toolbar select{width:auto}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;text-align:left;font-weight:600;font-size:12px;color:var(--muted);background:var(--surface2);padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;max-width:340px}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--surface2)}
td .clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--idle-soft);color:var(--idle)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}
.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;border:1px solid var(--border);color:var(--muted);margin:1px 2px 1px 0;white-space:nowrap}
.empty{padding:36px;text-align:center;color:var(--muted)}
.seed{font-size:10.5px;color:var(--muted);border:1px dashed var(--border);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}
/* roadmap */
.phase{margin-bottom:18px}
.phase header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.phase header h2{margin:0}
.phase header .when{color:var(--muted);font-size:12.5px}
.phase.now{border-color:var(--accent)}
.phase .prog{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.phase .prog .bar{flex:1}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--border);align-items:start}
.task .st{all:unset;cursor:pointer;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);display:grid;place-items:center;font-size:12px;margin-top:1px}
.task .st.doing{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.task .st.done{border-color:var(--ok);background:var(--ok);color:#fff}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .tt{font-weight:600}
.task .ds{color:var(--muted);font-size:13px}
.task .meta{font-size:12px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted)}
.task .tip{margin-top:6px;font-size:12.5px;background:var(--accent-soft);border-radius:6px;padding:6px 9px}
.task .note{margin-top:6px;font-size:12.5px;border-left:2px solid var(--border);padding-left:8px;white-space:pre-wrap}
.lnk{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:start center;overflow:auto;padding:40px 16px;z-index:10}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:720px;padding:20px 22px}
.modal h2{font-size:17px;margin-bottom:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .f.full{grid-column:1/-1}
.form label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.form .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.checks{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto;border:1px solid var(--border);border-radius:7px;padding:8px}
.checks label{display:inline-flex;align-items:center;gap:5px;font-weight:400;font-size:12.5px;color:var(--text);margin:0;border:1px solid var(--border);padding:2px 8px;border-radius:20px;cursor:pointer}
.checks input{margin:0}
.mfoot{display:flex;gap:8px;margin-top:18px}
.mfoot .sp{flex:1}
.list-mini{margin:0;padding:0;list-style:none}
.list-mini li{padding:7px 0;border-top:1px solid var(--border);display:flex;gap:8px;align-items:baseline;font-size:13px}
.list-mini li:first-child{border-top:0}
.list-mini .when{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;z-index:20}
/* guide */
.guide{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px}
.guide>summary,.tguide>summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:13.5px;color:var(--accent)}
.gbody{padding:2px 16px 16px;font-size:13px}
.gbody h3{font-size:12.5px;margin:14px 0 6px;color:var(--muted);letter-spacing:.02em}
.gbody ul,.tguide ul{margin:0;padding-left:18px}.gbody li,.tguide li{margin:3px 0}.gbody p{margin:0}
.ana{background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.gt td{max-width:none;min-width:120px}.gt tbody tr{cursor:default}.gt tbody tr:hover{background:none}
.pre{white-space:pre-wrap}
.tguide{margin-top:6px;border:1px solid var(--border);border-radius:7px;font-size:12.5px}
.tguide>summary{padding:6px 10px;font-size:12.5px}
.tguide>div{padding:0 12px 10px}.tguide p{margin:8px 0 4px}
.sample{background:var(--surface2);border-radius:6px;padding:8px 10px;font-size:12.5px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.mhead h2{margin:0}
.tg{font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.cnote{background:var(--info-soft);border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}
.form .ex{display:none;margin-top:5px;font-size:12px;color:var(--muted);border-left:2px solid var(--accent);padding-left:8px}
.form.showex .ex{display:block}.form .ex .pre{color:var(--text);margin-top:2px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px}
.pcard[open]{border-color:var(--accent)}
.pcard>summary{cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
.pcard>summary::-webkit-details-marker{display:none}
.pid{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:22px}
.ptitle{font-weight:600;flex:1;min-width:240px}
.pmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pbody{padding:2px 16px 16px;font-size:13px;border-top:1px solid var(--border)}
.pbody h3{font-size:12.5px;margin:14px 0 6px;color:var(--muted)}.pbody p{margin:0}
.pbody ul,.pbody ol{margin:0;padding-left:18px}.pbody li{margin:4px 0}
.meta2{display:flex;flex-direction:column;gap:5px;margin:12px 0;font-size:12.5px;color:var(--muted)}.meta2 b{color:var(--text);margin-right:6px}
.mine{display:flex;gap:12px;flex-wrap:wrap;background:var(--surface2);border-radius:8px;padding:12px;margin:12px 0}
.mine label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}.mine select{width:150px}.mine textarea{min-height:58px}
a{color:var(--accent)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);padding:12px}
  nav{flex-direction:row;overflow-x:auto;gap:4px}nav .grp{display:none}nav button{white-space:nowrap;gap:6px}
  .save{display:none}.brand{padding-bottom:8px}
  main{padding:18px 16px 50px}
  .g4,.g3,.g2{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}
}
@media (max-width:520px){.g4,.g3,.g2{grid-template-columns:1fr}}
@media print{aside,.toolbar,.btn{display:none!important}.app{display:block}main{padding:0}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>ITGC 온보딩 워크북</b><span id="brandSub">수탁·거래소 · ITGC / 내부통제 / ISMS</span></div>
    <nav id="nav"></nav>
    <div class="save" id="saveState"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<script>
const PHASES = [
  {id:'p0', name:'0단계 · 입사 전', from:null, to:-1, goal:'공개 정보만으로 기준선(규제·리스크)을 만들어 둔다.'},
  {id:'p1', name:'1단계 · 입사 1~4주', from:0, to:27, goal:'환경을 파악한다 — 무엇이 있고, 누가 맡고, 어디가 비어 있는지.'},
  {id:'p2', name:'2단계 · 입사 2~3개월', from:28, to:90, goal:'본 산출물을 만든다 — 통합 RCM, 통제기술서, 테스트·증적 체계.'},
  {id:'p3', name:'3단계 · 3개월 이후', from:91, to:null, goal:'반복 업무를 자동화하고 통제를 개선 과제로 연결한다.'}
];

const FRAMEWORKS = ['ITGC','내부회계','ISMS-P','이용자보호법','특금법','전자금융'];

/* 필드 타입: text | area | select | multi | date | ref(다른 모듈 다중 참조) */
const MODULES = {
  systems:{name:'시스템 인벤토리', group:'환경 파악', idPrefix:'SYS', title:'name',
    intro:'회사에 어떤 시스템이 있고 누가 맡는지, 재무·규제 관점에서 범위에 드는지 기록합니다. 1단계에서 가장 먼저 채울 표입니다.',
    fields:[
      {k:'name',l:'시스템명',t:'text',req:1},
      {k:'cat',l:'구분',t:'select',o:['거래소 코어','지갑·키관리','원장·정산','계정·인증','CI/CD·배포','DB','인프라(클라우드·K8s)','모니터링·로그','업무시스템(ERP·HR)','외부 연계·벤더','기타']},
      {k:'desc',l:'역할 설명',t:'area',full:1,h:'이 시스템이 자산·거래·재무 데이터 흐름에서 맡는 역할'},
      {k:'owner',l:'담당 팀 / Owner',t:'text'},
      {k:'stack',l:'기술 스택 · 호스팅',t:'text',h:'예: AWS EKS, Aurora MySQL, SaaS'},
      {k:'fin',l:'재무 영향도',t:'select',o:['상','중','하','없음','미정']},
      {k:'scope',l:'스코프',t:'select',o:['미정','ITGC+ISMS','ITGC','ISMS','제외']},
      {k:'auth',l:'인증·권한 부여 방식',t:'text',h:'예: SSO(Okta) + 팀장 승인 티켓'},
      {k:'deploy',l:'변경·배포 경로',t:'text',h:'예: GitHub PR → ArgoCD, 승인 2인'},
      {k:'data',l:'주요 데이터·DB',t:'text'},
      {k:'note',l:'비고 / 확인할 것',t:'area',full:1}
    ],
    cols:['name','cat','owner','fin','scope'], filters:['cat','scope','fin']},

  people:{name:'이해관계자', group:'환경 파악', idPrefix:'PPL', title:'name',
    intro:'통제 담당자(PO), 개발·인프라 리드, 감사인, 심사원 등 함께 일할 사람과 역할을 정리합니다.',
    fields:[
      {k:'name',l:'이름',t:'text',req:1},
      {k:'team',l:'팀 · 소속',t:'text'},
      {k:'role',l:'역할',t:'select',o:['통제 담당자(PO)','개발 리드','인프라·보안','재무·회계','경영진','외부 감사인','ISMS 심사·컨설팅','벤더','기타']},
      {k:'systems',l:'담당 시스템',t:'ref',m:'systems',full:1},
      {k:'note',l:'메모',t:'area',full:1,h:'소통 채널, 선호 방식, 합의한 내용 등'}
    ],
    cols:['name','team','role','systems'], filters:['role']},

  regs:{name:'규제–통제 매핑', group:'기준', idPrefix:'REG', title:'req',
    intro:'법·인증 기준의 요구사항을 통제 언어로 바꾸고, 어떤 통제가 그 요구사항을 충족하는지 연결합니다. 기본 항목은 주제만 잡아 둔 것이므로 조항 번호와 원문은 직접 확인해 채우세요.',
    fields:[
      {k:'law',l:'규제 · 기준',t:'select',o:['가상자산이용자보호법','특정금융정보법','ISMS-P','내부회계관리제도','전자금융거래법','기타'],req:1},
      {k:'clause',l:'조항 · 항목 번호',t:'text',h:'원문 확인 후 입력'},
      {k:'req',l:'요구사항 요약',t:'area',full:1,req:1},
      {k:'need',l:'필요한 통제',t:'area',full:1},
      {k:'controls',l:'연결 통제',t:'ref',m:'controls',full:1},
      {k:'status',l:'충족 상태',t:'select',o:['미확인','미충족','부분 충족','충족','해당 없음']},
      {k:'note',l:'비고',t:'area',full:1}
    ],
    cols:['law','clause','req','controls','status'], filters:['law','status']},

  controls:{name:'RCM · 통제 목록', group:'기준', idPrefix:'CTL', title:'name',
    intro:'통제 하나에 여러 프레임워크를 함께 매핑하는 통합 RCM입니다. 기본 항목은 초안이므로 실제 프로세스를 확인한 뒤 고치거나 지우세요.',
    fields:[
      {k:'cid',l:'통제 ID',t:'text',h:'예: AM-01'},
      {k:'area',l:'영역',t:'select',o:['접근관리','변경관리','운영관리','프로그램 개발','키관리·지갑','원장·대사','ITAC(자동통제)','기타'],req:1},
      {k:'name',l:'통제명',t:'text',req:1,full:1},
      {k:'risk',l:'리스크',t:'area',full:1},
      {k:'act',l:'통제 활동',t:'area',full:1,h:'누가 · 언제 · 무엇을 · 어떻게 · 어떤 증적을 남기는지'},
      {k:'type',l:'유형',t:'select',o:['예방','적발']},

   deploy:'코드가 운영에 반영되기까지의 관문을 순서대로 적습니다. 변경관리 통제(CM)의 설계 근거이며, “작성자와 승인자가 분리되는가”가 핵심입니다.',
   data:'테이블·버킷 이름까지 적어 두면 모집단 추출을 요청할 때 그대로 쓸 수 있습니다.',
   note:'아직 확인하지 못한 것을 번호를 붙여 적습니다. 다음 미팅의 질문 목록이 됩니다.'},
  example:{name:'출금 서명 서비스',cat:'지갑·키관리',desc:'승인이 끝난 출금 요청을 받아 트랜잭션을 만들고, HSM에 서명을 요청한 뒤 노드로 전파한다. 고객 자산이 회사 밖으로 나가는 마지막 관문.',owner:'지갑플랫폼팀 / 김○○(팀 리드)',stack:'AWS EKS(전용 노드 그룹) · Kotlin · CloudHSM · Aurora MySQL',fin:'상',scope:'ITGC+ISMS',auth:'SSO 로그인 후 접근제어 솔루션 경유. 운영 권한은 팀 리드 승인 티켓이 있어야 부여',deploy:'GitHub PR(리뷰 2인) → CI 테스트 → ArgoCD 수동 승인(승인자 ≠ 작성자)',data:'withdrawal_request, signed_tx 테이블(Aurora) · 서명 로그(S3, 변경 불가 설정)',note:'재무 영향도 “상” 근거: 고객 예치 가상자산 잔액을 직접 변동시킴.\n확인할 것 — ① HSM 관리자 계정 보유자 ② 긴급 배포 절차 유무 ③ 서명 로그 보존 기간'}},

 people:{
  analogy:'통제는 결국 사람이 수행합니다. 이 표는 “이 통제에 대해 물어볼 사람이 누구인가”를 찾는 전화번호부입니다.',
  good:['통제 영역(접근·변경·운영·키관리)마다 담당자가 최소 한 명씩 있다','메모에 “합의한 내용”이 날짜와 함께 남아 있다'],
  bad:'직책만 적고 담당 시스템을 연결하지 않는 것. 시스템과 연결해야 “이 시스템의 증적은 누구에게 요청하나”가 바로 나옵니다.',
  fields:{name:'실명. 외부인은 소속을 함께 적습니다.',team:'조직 개편이 잦으므로 확인한 날짜 기준의 팀명을 적습니다.',role:'통제 관점의 역할입니다. 직책이 아니라 “이 사람이 나에게 무엇을 해 주는가”로 고릅니다.',systems:'이 사람이 Owner이거나 실무 담당인 시스템을 연결합니다.',note:'선호하는 소통 채널, 바쁜 시기, 합의한 내용을 적습니다. 첫 인상이나 평가는 적지 않습니다.'},
  example:{name:'김○○',team:'지갑플랫폼팀',role:'개발 리드',systems:['출금 서명 서비스'],note:'슬랙 DM보다 팀 채널 스레드를 선호. 월말은 정산 대응으로 바쁨.\n10/12 합의 — 출금 정책 변경 이력은 매월 첫 주에 추출해 전달받기로 함.'}},

 regs:{
  analogy:'법 조문은 “무엇을 지켜라”만 말하고 “어떻게”는 말하지 않습니다. 이 표는 법의 문장을 통제의 문장으로 옮기는 번역 사전입니다. 통제 하나가 여러 법을 동시에 충족하도록 연결해 두면, 증적을 한 번 받아 여러 곳에 쓸 수 있습니다.',
  good:['조항 번호가 적혀 있고 원문을 직접 확인한 날짜가 비고에 있다','“필요한 통제”가 측정할 수 있는 문장이다(비율·주기·기한이 있음)','충족 상태가 “충족”이면 연결 통제의 테스트 결과가 “유효”다'],
  bad:'기사·요약 자료만 보고 조항을 적는 것. 시행령·감독규정·고시에서 수치가 정해지는 경우가 많고 개정도 잦으므로, 국가법령정보센터 원문을 기준으로 삼으세요.',
  fields:{law:'근거 법·인증 기준.',clause:'법·시행령·감독규정의 조·항·호까지 적습니다. 감사인과 심사원이 가장 먼저 묻는 항목입니다.',req:'원문을 그대로 옮기지 말고 “무엇을 요구하는가”를 한두 문장으로 요약합니다.',need:'요구사항을 충족하려면 회사 안에서 누가 무엇을 해야 하는지로 바꿔 씁니다.',controls:'이 요구사항을 충족하는 통제를 모두 연결합니다. 연결이 하나도 없으면 그 자체가 갭입니다.',status:'연결 통제가 없으면 미충족, 있지만 설계만 됐으면 부분 충족, 테스트까지 유효하면 충족.',note:'원문 확인일, 개정 예정 사항, 해석이 갈리는 부분을 적습니다.'},
  example:{law:'가상자산이용자보호법',clause:'법 제7조 및 시행령의 보관 비율 조문(항 번호는 원문에서 확인)',req:'이용자 가상자산을 회사 자산과 분리해 보관하고, 이용자 가상자산의 경제적 가치 중 시행령이 정한 비율(80%) 이상을 인터넷과 분리된 방식(콜드월렛)으로 보관해야 한다.',need:'① 콜드월렛 보관 비율을 매일 산출하고 기준 미달 시 즉시 보고 ② 콜드→핫 이동은 사전 승인 ③ 비율 산출 로직(시세 기준, 대상 자산)의 변경관리',controls:['KM-03','LR-01'],status:'부분 충족',note:'원문 확인일 2026-10-06(국가법령정보센터). 디지털자산기본법 시행에 따른 비율·산정 방식 변경 여부를 분기마다 재확인.'}},

 controls:{
  analogy:'통제기술서는 요리 레시피와 같습니다. “적당히 간을 한다”로는 다른 사람이 같은 맛을 낼 수 없듯, “적절히 검토한다”로는 감사인이 같은 결론을 낼 수 없습니다. 누가·언제·무엇을·어떻게·무슨 증적을 남기는지가 모두 들어가야 합니다.',
  good:['통제 활동 문장에 주어(수행자), 시점·기한, 대상, 방법, 증적이 모두 있다','리스크가 “~할 수 있다”로 끝나고, 통제가 그 리스크를 직접 막거나 찾아낸다','증적이 “모집단(전체 목록)”과 “건별 증적”으로 나뉘어 있다','자동통제라면 어떤 설정·로직이 통제인지 특정되어 있다'],
  bad:'정책서 문장을 그대로 옮기는 것(“권한은 최소한으로 부여한다”). 정책은 원칙이고 통제는 행위입니다. 또 하나의 흔한 실수는 실제로 하지 않는 일을 적는 것 — 운영 테스트에서 바로 미비가 됩니다.',
  fields:{cid:'영역 약어 + 일련번호(AM-01). 감사인 RCM과 번호를 맞추면 소통이 쉬워집니다.',area:'ITGC 4개 영역에 가상자산 고유 영역(키관리·지갑, 원장·대사)을 더했습니다.',name:'명사형으로 짧게. 무엇을 통제하는지 이름만 보고 알 수 있어야 합니다.',risk:'“무엇이 잘못될 수 있는가”를 씁니다. 통제가 없다고 가정하고 최악의 경우를 한 문장으로.',act:'가장 중요한 칸입니다. 누가 · 언제 · 무엇을 · 어떻게 · 어떤 증적을 남기는지. 자동과 수동이 섞여 있으면 문장을 나눕니다.',type:'사고 전에 막으면 예방, 사고 후에 찾아내면 적발. 핵심 리스크에는 둘 다 있는 것이 좋습니다.',mode:'시스템이 강제하면 자동, 사람이 시스템 리포트를 보고 판단하면 IT 의존 수동(이 경우 리포트의 정확성도 검증 대상).',freq:'주기가 샘플 수를 결정합니다. 건별 통제는 모집단 크기에 따라, 월 통제는 보통 2~3건.',owner:'수행자 본인. 팀명만 적으면 책임이 흐려집니다.',systems:'이 통제가 걸려 있는 시스템을 모두 연결합니다.',fw:'이 통제가 충족하는 프레임워크를 모두 고릅니다. 여기가 “증적 한 번, 활용 여러 번”의 출발점입니다.',evid:'① 모집단 ② 건별 증적 ③ 검토 흔적 순으로 적습니다. 추출 경로까지 적으면 다음 분기에 시간을 아낍니다.',design:'담당자와 문장을 합의하면 확정. 합의 전에는 초안·검토 중.',test:'설계·운영 테스트 결과. 미비면 이슈·발견사항에 등록하고 연결합니다.',note:'정책서와의 일치 여부, 예외 상황, 보완통제를 적습니다.'},
  example:{cid:'AM-02',area:'접근관리',name:'퇴사자·이동자 권한 회수',risk:'퇴사·이동한 인원의 계정이 남아 거래·원장 시스템에 무단 접근하거나 출금 승인에 관여할 수 있다.',act:'인사팀이 HR 시스템에 퇴사·이동 발령을 등록하면 계정관리 시스템이 당일 SSO 계정을 자동으로 비활성화한다.\nSSO와 연동되지 않은 시스템(HSM 관리 콘솔, 노드 서버)은 IT보안 담당자가 발령일로부터 1영업일 안에 수동으로 회수하고, 회수 화면을 티켓에 첨부한다.\n내부통제 담당자는 매월 HR 발령 목록과 시스템별 활성 계정을 대조해 잔존 계정이 없는지 확인하고 결과를 기록한다.',type:'예방',mode:'IT 의존 수동',freq:'수시(건별)',owner:'IT보안팀 박○○',systems:['출금 서명 서비스'],fw:['ITGC','내부회계','ISMS-P'],evid:'① HR 발령 목록(모집단, HR 시스템 > 발령 조회 > 엑셀 추출)\n② 계정 비활성화 로그(일시 포함) 또는 수동 회수 티켓\n③ 월별 대조 결과와 검토자 확인 기록',design:'검토 중',test:'미수행',note:'회수 기한 “1영업일”이 계정관리 지침과 일치하는지 확인 필요.\nSSO 미연동 시스템 목록은 시스템 인벤토리의 인증 방식 칸으로 관리.'}},

 risks:{
  analogy:'소방 점검표는 과거 화재 사례에서 나옵니다. 이 표는 “남의 회사에 난 불”을 모아 “우리 집 어디에 소화기가 없는지” 찾는 용도입니다. 현업에게 통제를 제안할 때 “규정이라서”보다 “이런 사고가 이렇게 났습니다”가 훨씬 잘 통합니다.',
  good:['원인이 기술적으로 구체적이다(“보안 미흡”이 아니라 “서명 키가 배포 서버의 환경변수에 평문 저장”)','빠진 통제가 RCM의 통제와 연결되어 있다','테스트 방법이 우리 회사에서 바로 확인할 수 있는 행동이다'],
  bad:'사고 규모(피해액)만 적고 원인을 적지 않는 것. 피해액은 설득에는 도움이 되지만 통제 설계에는 원인만 쓰입니다.',
  fields:{title:'무슨 일이 일어났는지 한 줄로.',kind:'유형별로 통제가 충분한지 볼 수 있게 분류합니다.',impact:'우리 회사에서 같은 일이 나면 어느 정도인지로 판단합니다.',cause:'“왜 가능했는가”를 기술적으로. 공개 보고서에 원인이 없으면 “원인 미공개”라고 적습니다.',gap:'그 원인을 막았을 통제. 하나의 사고에 예방·적발 통제를 각각 생각해 봅니다.',how:'우리 회사에 같은 구멍이 있는지 확인하는 방법. 설정 화면, 목록 대조, 시나리오 테스트 등.',controls:'이미 RCM에 있는 통제를 연결합니다. 연결할 통제가 없으면 신규 통제 후보입니다.',src:'실제 사례는 기사·보고서 링크와 날짜를 남깁니다. 출처가 없는 사례는 “일반 시나리오”로 표시합니다.'},
  example:{title:'출금 승인자가 승인 임계값을 직접 낮춰 단독 출금',kind:'내부자',impact:'상',cause:'출금 정책(승인 인원 수, 한도) 변경 화면에 별도 승인 절차가 없어, 관리자 권한 보유자 한 명이 m-of-n의 m을 1로 바꿀 수 있었음. 변경 알림도 없었음.',gap:'예방 — 출금 정책 변경의 이중 승인(요청자 ≠ 승인자)\n적발 — 정책 변경 이력의 월별 검토, 변경 즉시 알림',how:'① 정책 변경 화면에서 단독 변경이 가능한지 테스트 환경에서 확인\n② 최근 12개월 정책 변경 로그 전수에서 승인 기록 누락 건 확인\n③ 변경 알림 수신자 확인',controls:['KM-04','KM-02'],src:'일반 시나리오(내부 설계 검토용)'}},

 issues:{
  analogy:'병원 차트와 같습니다. 증상(현상), 진단(원인), 처방(조치 계획), 경과(상태)가 한 장에 있어야 다음 사람이 이어서 볼 수 있습니다.',

</script>
<script>
const KEY='itgc-onboarding-workbook-v1';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const now=()=>new Date().toISOString();
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const dayDiff=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5);

/* ---------- 저장 계층 ---------- */
let storageOK=true, S, view={page:'dash',q:'',f:{},ex:true,g:false};
function probe(){try{localStorage.setItem(KEY+':t','1');localStorage.removeItem(KEY+':t');return true}catch(e){return false}}
function fresh(){
  const s={v:1,meta:{startDate:'',company:'',createdAt:now(),lastExport:'',dirty:false},tasks:[],data:{},seq:{},play:{}};
  Object.keys(MODULES).forEach(m=>{s.data[m]=[];s.seq[m]=0});s.seq.task=0;
  SEED_TASKS.forEach(([phase,title,desc,output,tip,module])=>s.tasks.push({id:'T'+(++s.seq.task),phase,title,desc,output,tip,module,status:'대기',due:'',note:'',doneAt:'',seed:true}));
  const mk=(m,o)=>{const id=MODULES[m].idPrefix+'-'+String(++s.seq[m]).padStart(3,'0');const r={id,seed:true,createdAt:now(),updatedAt:now(),...o};s.data[m].push(r);return r};
  SEED_DATA.controls.forEach(c=>mk('controls',c));
  const byCid=cids=>cids.map(c=>s.data.controls.find(x=>x.cid===c)?.id).filter(Boolean);
  SEED_DATA.regs.forEach(([law,req,need,c])=>mk('regs',{law,req,need,controls:byCid(c),status:'미확인',clause:'',note:'조항 번호와 원문 확인 필요'}));
  s.tasks.push(playTask(s));
  SEED_DATA.risks.forEach(([title,kind,impact,cause,gap,how,c])=>mk('risks',{title,kind,impact,cause,gap,how,controls:byCid(c),src:'일반 시나리오'}));
  return s;
}
function load(){
  storageOK=probe();
  if(storageOK){try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);migrate(S);return}}catch(e){}}
  S=fresh();persist(true);
}
function migrate(s){
  Object.keys(MODULES).forEach(m=>{s.data[m]??=[];s.seq[m]??=0});s.play??={};
  if(!s.tasks.some(t=>t.gkey==='PLAY'))s.tasks.push(playTask(s));
}
function playTask(s){return{id:'T'+(++s.seq.task),gkey:'PLAY',phase:'p1',title:'예상 이슈 플레이북 점검',desc:'업종에서 예상되는 이슈 30개를 우리 회사에 하나씩 대조해 해당 여부를 판정하고, 해당하는 것은 이슈로 등록한다.',output:'이슈별 점검 상태와 확인 결과 메모',tip:'이슈 카드의 “Claude용 복사”로 내용과 내 메모를 넘기고, 우리 회사 상황에 맞춘 확인 질문과 조치안을 요청하세요.',module:'play',status:'대기',due:'',note:'',doneAt:'',seed:true}}
function persist(silent){
  if(!silent)S.meta.dirty=true;
  if(storageOK){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}
  renderSave();
}
function renderSave(){
  const el=$('#saveState');if(!el)return;
  el.innerHTML=storageOK?`<span class="dot"></span>이 브라우저에 자동 저장됨<br>마지막 백업: ${S.meta.lastExport?esc(S.meta.lastExport.slice(0,10)):'없음'}`
    :`<span class="dot off"></span>저장소를 쓸 수 없음<br>닫기 전에 백업 파일로 내보내세요`;
}

/* ---------- 공통 ---------- */
function pill(v){if(!v)return'';let c='';for(const k in PILL)if(PILL[k].includes(v))c=k;return`<span class="pill ${c}">${esc(v)}</span>`}
function recTitle(m,id){const r=S.data[m].find(x=>x.id===id);if(!r)return null;const M=MODULES[m];return (m==='controls'&&r.cid?r.cid+' ':'')+(r[M.title]||r.id)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function phaseOfToday(){
  if(!S.meta.startDate)return null;const n=dayDiff(today(),S.meta.startDate);
  return PHASES.find(p=>(p.from===null||n>=p.from)&&(p.to===null||n<=p.to));
}
function phaseRange(p){
  if(!S.meta.startDate)return p.from===null?'입사일 이전':'입사일을 설정하면 날짜가 표시됩니다';
  const sd=S.meta.startDate;
  if(p.from===null)return`~ ${addDays(sd,-1)}`;
  if(p.to===null)return`${addDays(sd,p.from)} ~`;
  return`${addDays(sd,p.from)} ~ ${addDays(sd,p.to)}`;
}
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}
}

/* ---------- 내비게이션 ---------- */
function renderNav(){
  const items=[['dash','대시보드',null,''],['road','단계별 로드맵',null,`${S.tasks.filter(t=>t.status==='완료').length}/${S.tasks.length}`],['play','예상 이슈 플레이북',null,`${PLAYBOOK.filter(x=>pst(x.id)!=='미확인').length}/${PLAYBOOK.length}`]];
  let html='',grp='';
  items.forEach(([id,name,,cnt])=>html+=`<button data-page="${id}" class="${view.page===id?'on':''}"><span>${name}</span><span class="cnt">${cnt}</span></button>`);
  Object.entries(MODULES).forEach(([id,M])=>{
    if(M.group!==grp){grp=M.group;html+=`<div class="grp">${grp}</div>`}
    html+=`<button data-page="${id}" class="${view.page===id?'on':''}"><span>${M.name}</span><span class="cnt">${S.data[id].length}</span></button>`});
  html+=`<div class="grp">관리</div><button data-page="data" class="${view.page==='data'?'on':''}"><span>설정 · 백업</span><span class="cnt"></span></button>`;
  $('#nav').innerHTML=html;
}
function go(page,f){view={page,q:'',f:f||{},ex:view.ex,g:view.g,g2:view.g2};render();window.scrollTo(0,0)}
function render(){
  renderNav();renderSave();
  const m=$('#main');
  const warn=(!storageOK?`<div class="banner bad"><b>이 화면에서는 데이터가 저장되지 않습니다.</b> 미리보기 환경이거나 브라우저 저장소가 막혀 있습니다. 파일을 내려받아 Chrome·Edge에서 직접 열면 입력한 내용이 그 PC에 누적됩니다.</div>`:'')
    +(storageOK&&S.meta.dirty&&dayDiff(today(),(S.meta.lastExport||S.meta.createdAt).slice(0,10))>=7?`<div class="banner">마지막 백업 이후 7일 넘게 변경분이 쌓였습니다. <button class="lnk" data-act="export">지금 백업 파일 내보내기</button></div>`:'');
  if(view.page==='dash')m.innerHTML=warn+dash();
  else if(view.page==='road')m.innerHTML=warn+road();
  else if(view.page==='data')m.innerHTML=warn+dataPage();
  else if(view.page==='play')m.innerHTML=warn+playPage();
  else m.innerHTML=warn+modulePage(view.page);
}

/* ---------- 대시보드 ---------- */
function stack(parts){const tot=parts.reduce((a,p)=>a+p[1],0)||1;
  return`<div class="bar">${parts.map(p=>`<i style="width:${p[1]/tot*100}%;background:var(--${p[2]})"></i>`).join('')}</div><div class="legend">${parts.map(p=>`<span style="--c:var(--${p[2]})">${esc(p[0])} ${p[1]}</span>`).join('')}</div>`}
function countBy(arr,k,vals){return vals.map(v=>arr.filter(r=>(r[k]||'')===v).length)}

    :`<h1>대시보드</h1><div class="banner">입사일을 설정하면 단계별 기간과 현재 단계가 계산됩니다. <button class="lnk" data-page="data">설정으로 이동</button></div>`;

              ...openEvd.filter(e=>e.due&&e.due<=addDays(today(),7)).map(e=>({d:e.due,t:e.title,m:'evidence',id:e.id,k:'증적'})),
              ...S.tasks.filter(t=>t.status!=='완료'&&t.due&&t.due<=addDays(today(),7)).map(t=>({d:t.due,t:t.title,m:'task',id:t.id,k:'로드맵'}))].sort((a,b)=>a.d.localeCompare(b.d));
  const logs=[...S.data.log].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);
  const fwMax=Math.max(1,...FRAMEWORKS.map(f=>ctl.filter(c=>(c.fw||[]).includes(f)).length));
  return head+`
  <div class="grid g4" style="margin-bottom:14px">
    <div class="card stat"><div class="l">로드맵 진행</div><div class="n">${Math.round(done/(S.tasks.length||1)*100)}%</div><div class="d">${done} / ${S.tasks.length} 완료</div></div>
    <div class="card stat"><div class="l">시스템</div><div class="n">${sys.length}</div><div class="d">스코프 미정 ${sys.filter(s=>!s.scope||s.scope==='미정').length}</div></div>
    <div class="card stat"><div class="l">통제</div><div class="n">${ctl.length}</div><div class="d">확정 ${ctl.filter(c=>c.design==='확정').length} · 테스트 미비 ${ctl.filter(c=>c.test==='미비').length}</div></div>
    <div class="card stat"><div class="l">열린 이슈</div><div class="n">${openIss.length}</div><div class="d" style="color:var(--${overIss.length+overEvd.length?'bad':'muted'})">기한 초과 ${overIss.length} · 증적 지연 ${overEvd.length}</div></div>
  </div>
  <div class="grid g2" style="margin-bottom:14px">
    <div class="card"><h2>${ph?'이번 단계에서 할 일':'남은 할 일'}</h2>
      ${cur.length?`<ul class="list-mini">${cur.slice(0,7).map(t=>`<li>${t.status==='진행'?'<span class="pill warn">진행</span>':''}<button class="lnk" data-page="road">${esc(t.title)}</button></li>`).join('')}</ul>${cur.length>7?`<div class="legend">외 ${cur.length-7}건</div>`:''}`:'<div class="empty">이 단계의 할 일을 모두 마쳤습니다.</div>'}</div>
    <div class="card"><h2>기한 임박 · 초과 (7일 이내)</h2>
      ${soon.length?`<ul class="list-mini">${soon.slice(0,7).map(x=>`<li><span class="when" style="${x.d<today()?'color:var(--bad)':''}">${x.d}</span><span class="tag">${x.k}</span><button class="lnk" ${x.m==='task'?'data-page="road"':`data-open="${x.m}:${x.id}"`}>${esc(x.t)}</button></li>`).join('')}</ul>`:'<div class="empty">임박한 기한이 없습니다.</div>'}</div>
  </div>
  <div class="card" style="margin-bottom:14px"><h2>예상 이슈 점검 현황 <button class="lnk" data-page="play" style="font-weight:400;font-size:12.5px;margin-left:6px">플레이북 열기</button></h2>${(()=>{const c=PLAY_STATES.map(s=>PLAYBOOK.filter(x=>pst(x.id)===s).length);return stack([['해결',c[4],'ok'],['이슈 등록',c[3],'bad'],['확인 중',c[1],'warn'],['해당 없음',c[2],'idle'],['미확인',c[0],'info']])})()}</div>
  <div class="card" style="margin-bottom:14px"><h2>단계별 진행</h2><div class="grid g4">
    ${PHASES.map(p=>{const ts=S.tasks.filter(t=>t.phase===p.id),d=ts.filter(t=>t.status==='완료').length,g=ts.filter(t=>t.status==='진행').length;
      return`<div><div style="font-size:12.5px;font-weight:600;margin-bottom:6px;${ph?.id===p.id?'color:var(--accent)':''}">${esc(p.name)}</div><div class="bar"><i style="width:${d/(ts.length||1)*100}%;background:var(--ok)"></i><i style="width:${g/(ts.length||1)*100}%;background:var(--warn)"></i></div><div class="legend">${d}/${ts.length} 완료${g?` · 진행 ${g}`:''}</div></div>`}).join('')}
  </div></div>
  <div class="grid g3" style="margin-bottom:14px">
    <div class="card"><h2>규제 충족 상태</h2>${(()=>{const v=['충족','부분 충족','미충족','미확인','해당 없음'],c=countBy(reg,'status',v);return stack([[v[0],c[0],'ok'],[v[1],c[1],'warn'],[v[2],c[2],'bad'],[v[3],c[3],'info'],[v[4],c[4],'idle']])})()}</div>
    <div class="card"><h2>통제 설계 상태</h2>${(()=>{const v=['확정','검토 중','초안','폐기'],c=countBy(ctl,'design',v);return stack([[v[0],c[0],'ok'],[v[1],c[1],'warn'],[v[2],c[2],'info'],[v[3],c[3],'idle']])})()}</div>
    <div class="card"><h2>통제 테스트 결과</h2>${(()=>{const v=['유효','미비','미수행','해당 없음'],c=countBy(ctl,'test',v);return stack([[v[0],c[0],'ok'],[v[1],c[1],'bad'],[v[2],c[2],'info'],[v[3],c[3],'idle']])})()}</div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>프레임워크별 통제 수</h2>${FRAMEWORKS.map(f=>{const c=ctl.filter(x=>(x.fw||[]).includes(f)).length;return`<div style="display:grid;grid-template-columns:96px 1fr 28px;gap:8px;align-items:center;font-size:12.5px;margin:6px 0"><span>${f}</span><div class="bar"><i style="width:${c/fwMax*100}%;background:var(--accent)"></i></div><span style="text-align:right;font-variant-numeric:tabular-nums">${c}</span></div>`}).join('')}</div>
    <div class="card"><h2>최근 업무 일지</h2>${logs.length?`<ul class="list-mini">${logs.map(l=>`<li><span class="when">${esc(l.date)}</span><span class="tag">${esc(l.kind||'기타')}</span><button class="lnk" data-open="log:${l.id}">${esc(l.title)}</button></li>`).join('')}</ul>`:`<div class="empty">아직 기록이 없습니다. <button class="lnk" data-new="log">첫 일지 쓰기</button></div>`}</div>
  </div>`;
}

  return`<h1>단계별 로드맵</h1><p class="sub">입사 시점을 기준으로 단계마다 해야 할 일과 남길 산출물입니다. 체크 상자를 누르면 대기 → 진행 → 완료 순으로 바뀌고, 할 일을 누르면 메모와 기한을 적을 수 있습니다.</p>
  <div class="toolbar"><button class="btn pri" data-act="newTask">할 일 추가</button></div>
  ${PHASES.map(p=>{const ts=S.tasks.filter(t=>t.phase===p.id),d=ts.filter(t=>t.status==='완료').length;
    return`<section class="card phase ${ph?.id===p.id?'now':''}"><header><h2>${esc(p.name)}</h2><span class="when">${phaseRange(p)}</span>${ph?.id===p.id?'<span class="pill ok">현재 단계</span>':''}</header>

      <div><div class="tt">${esc(t.title)}</div><div class="ds">${esc(t.desc)}</div>
        <div class="meta">${t.output?`<span>산출물: ${esc(t.output)}</span>`:''}${t.due?`<span style="${t.status!=='완료'&&t.due<today()?'color:var(--bad)':''}">기한 ${t.due}</span>`:''}${t.doneAt?`<span>완료 ${t.doneAt}</span>`:''}${t.module?`<button class="lnk" data-page="${t.module}">${t.module==='play'?'예상 이슈 플레이북':MODULES[t.module].name} 열기 →</button>`:''}</div>

    </section>`}).join('')}`;
}
function taskGuide(t){const G=t.gkey?TASK_GUIDE[t.gkey]:TASK_GUIDE[t.id];if(!G)return'';

/* ---------- 입력 모듈 ---------- */
function filtered(m){
  const M=MODULES[m],q=view.q.trim().toLowerCase();
  let rows=S.data[m].filter(r=>{
    for(const k in view.f)if(view.f[k]&&(r[k]||'')!==view.f[k])return false;
    if(!q)return true;
    return M.fields.some(f=>{const v=r[f.k];if(f.t==='ref')return(v||[]).some(id=>(recTitle(f.m,id)||'').toLowerCase().includes(q));return String(Array.isArray(v)?v.join(' '):v??'').toLowerCase().includes(q)})||r.id.toLowerCase().includes(q)});
  const s=M.sort;if(s)rows=[...rows].sort((a,b)=>String(a[s.k]||'').localeCompare(String(b[s.k]||''))*s.dir);
  return rows;
}
function cell(m,f,r){
  const v=r[f.k];
  if(f.t==='ref')return(v||[]).map(id=>{const t=recTitle(f.m,id);return t?`<span class="tag">${esc(t.length>22?t.slice(0,22)+'…':t)}</span>`:''}).join('');
  if(f.t==='multi')return(v||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('');
  if(f.t==='select')return pill(v);
  if(f.t==='date'){const late=f.k==='due'&&v&&v<today()&&!['종결','완료','수령'].includes(r.status);return`<span style="white-space:nowrap;${late?'color:var(--bad);font-weight:600':''}">${esc(v)}</span>`}
  return`<div class="clip">${esc(v)}${f.k===MODULES[m].title&&r.seed?'<span class="seed">기본</span>':''}</div>`;
}

function exVal(f,v){return Array.isArray(v)?v.join(', '):(v??'')}

  </div></details>`;

function exPrefill(m){

  M.fields.forEach(f=>{const v=ex[f.k];
    if(f.t==='ref')o[f.k]=(v||[]).map(l=>S.data[f.m].find(r=>r.cid===l||r[MODULES[f.m].title]===l)?.id).filter(Boolean);

function recModal(m,id,pre){

    function done(){persist();closeModal();render();toast('불러왔습니다')}};

}
function merge(d){
  Object.keys(MODULES).forEach(m=>{(d.data[m]||[]).forEach(r=>{const i=S.data[m].findIndex(x=>x.id===r.id);if(i<0)S.data[m].push(r);else if((r.updatedAt||'')>(S.data[m][i].updatedAt||''))S.data[m][i]=r});
    S.seq[m]=Math.max(S.seq[m]||0,d.seq?.[m]||0,...S.data[m].map(r=>+r.id.split('-')[1]||0))});
  d.tasks.forEach(t=>{if(t.gkey&&S.tasks.some(x=>x.gkey===t.gkey&&x.id!==t.id))return;const i=S.tasks.findIndex(x=>x.id===t.id);if(i<0)S.tasks.push(t);else if(!t.seed||t.status!=='대기'||t.note)S.tasks[i]=t});
  S.seq.task=Math.max(S.seq.task||0,d.seq?.task||0,...S.tasks.map(t=>+t.id.slice(1)||0));
  Object.entries(d.play||{}).forEach(([k,v])=>{if(!S.play[k]||(v.at||'')>(S.play[k].at||''))S.play[k]=v});
  if(!S.meta.startDate)S.meta.startDate=d.meta?.startDate||'';
}

/* ---------- 모달 ---------- */
function openModal(html){$('#modalRoot').innerHTML=`<div class="ov" data-ov><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;const f=$('#modalRoot input,#modalRoot select,#modalRoot textarea');f&&f.focus()}
let pendingPlay=null;
function closeModal(){$('#modalRoot').innerHTML='';pendingPlay=null}
let _cb=[];
function confirmBox(title,msg,btns){_cb=btns;openModal(`<h2>${esc(title)}</h2><p style="margin:0">${esc(msg)}</p><div class="mfoot"><span class="sp"></span><button class="btn" data-close>취소</button>${btns.map((b,i)=>`<button class="btn ${b[2]||'pri'}" data-cb="${i}">${esc(b[0])}</button>`).join('')}</div>`)}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-page],[data-open],[data-new],[data-save],[data-del],[data-close],[data-cycle],[data-edittask],[data-savetask],[data-deltask],[data-act],[data-csv],[data-claude],[data-cb],[data-fromex],[data-pissue],[data-pcopy],[data-ov]');
  if(!t)return;const d=t.dataset;
  if('ov' in d){if(e.target===t)closeModal();return}
  if(d.page)return go(d.page);
  if(d.open){const[m,id]=d.open.split(':');return recModal(m,id)}
  if(d.new){if(view.page!==d.new)go(d.new);return recModal(d.new)}
  if(d.pissue){const x=PLAYBOOK.find(p=>p.id===d.pissue);pendingPlay=x.id;return recModal('issues',null,playIssuePrefill(x))}
  if(d.pcopy){const ok=await copyText(playCopy(PLAYBOOK.find(p=>p.id===d.pcopy)));return toast(ok?'복사했습니다. Claude 대화창에 붙여 넣으세요':'복사하지 못했습니다')}
  if(d.fromex)return recModal(d.fromex,null,exPrefill(d.fromex));
  if('save' in d){const[m,id]=d.save.split(':');return saveRec(m,id)}
  if(d.del){const[m,id]=d.del.split(':');return confirmBox('항목 삭제',`${id} 항목을 삭제합니다. 다른 표에서 이 항목을 연결한 부분도 함께 해제됩니다.`,[['삭제',()=>delRec(m,id),'danger']])}
  if('close' in d)return closeModal();
  if(d.cb)return _cb[+d.cb][1]();
  if(d.cycle){const k=S.tasks.find(x=>x.id===d.cycle);k.status={대기:'진행',진행:'완료',완료:'대기'}[k.status];k.doneAt=k.status==='완료'?today():'';persist();return render()}
  if(d.edittask)return taskModal(d.edittask);
  if('savetask' in d){const frm=$('#frm');if(!frm.reportValidity())return;const o=Object.fromEntries(new FormData(frm));
    if(d.savetask){const k=S.tasks.find(x=>x.id===d.savetask);if(o.status==='완료'&&k.status!=='완료')o.doneAt=today();if(o.status!=='완료')o.doneAt='';Object.assign(k,o);delete k.seed}
    else S.tasks.push({id:'T'+(++S.seq.task),doneAt:o.status==='완료'?today():'',...o});
    persist();closeModal();render();return toast('저장했습니다')}
  if(d.deltask)return confirmBox('할 일 삭제','이 할 일을 로드맵에서 삭제합니다.',[['삭제',()=>{S.tasks=S.tasks.filter(x=>x.id!==d.deltask);persist();closeModal();render()},'danger']]);
  if(d.csv)return download(`${MODULES[d.csv].name}-${today()}.csv`,toCSV(d.csv),'text/csv');
  if(d.claude){const ok=await copyText(toClaude(d.claude));return toast(ok?'복사했습니다. Claude 대화창에 붙여 넣으세요':'복사하지 못했습니다')}
  if(d.act==='newTask')return taskModal();
  if(d.act==='export')return exportAll();
  if(d.act==='import')return $('#imp').click();
  if(d.act==='csvAll'){const keep=view;Object.keys(MODULES).forEach((m,i)=>setTimeout(()=>{view={page:m,q:'',f:{}};download(`${MODULES[m].name}-${today()}.csv`,toCSV(m),'text/csv');view=keep},i*250));return}
  if(d.act==='saveSet'){S.meta.startDate=$('#sd').value;S.meta.company=$('#co').value.trim();persist();applyBrand();render();return toast('저장했습니다')}
  if(d.act==='dropSeed')return confirmBox('기본 항목 삭제','수정하지 않은 기본 항목(통제·규제 매핑·리스크)을 모두 삭제합니다. 로드맵의 할 일은 그대로 둡니다.',[['삭제',()=>{Object.keys(MODULES).forEach(m=>S.data[m].filter(r=>r.seed).forEach(r=>delRec(m,r.id)));closeModal();render()},'danger']]);
  if(d.act==='reset')return confirmBox('전체 초기화','입력한 모든 내용이 지워집니다. 백업 파일을 먼저 내보냈는지 확인하세요.',[['초기화',()=>{S=fresh();persist(true);closeModal();go('dash')},'danger']]);
});
document.addEventListener('input',e=>{if(e.target.id==='q'){view.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{
  if(e.target.dataset.filter){view.f[e.target.dataset.filter]=e.target.value;render()}
  if(e.target.dataset.pstate){const id=e.target.dataset.pstate;S.play[id]={...(S.play[id]||{}),st:e.target.value,at:now()};view.po=id;persist();render()}
  if(e.target.dataset.pnote){const id=e.target.dataset.pnote;S.play[id]={...(S.play[id]||{}),note:e.target.value.trim(),at:now()};if(pst(id)==='미확인'&&e.target.value.trim())S.play[id].st='확인 중';view.po=id;persist();render()}
  if(e.target.id==='exToggle'){view.ex=e.target.checked;$('#frm').classList.toggle('showex',view.ex)}
  if(e.target.id==='imp'&&e.target.files[0]){importFile(e.target.files[0]);e.target.value=''}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&e.target.matches('tr[data-open]')){const[m,id]=e.target.dataset.open.split(':');recModal(m,id)}
});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('[data-guide]'))view.g=e.target.open;if(e.target.matches&&e.target.matches('[data-guide2]'))view.g2=!e.target.open;if(e.target.matches&&e.target.matches('[data-pcard]')){if(e.target.open)view.po=e.target.dataset.pcard;else if(view.po===e.target.dataset.pcard)view.po=null}},true);
document.addEventListener('submit',e=>e.preventDefault());
function applyBrand(){$('#brandSub').textContent=S.meta.company||'수탁·거래소 · ITGC / 내부통제 / ISMS'}
load();applyBrand();render();

</script>
</body>
</html>
